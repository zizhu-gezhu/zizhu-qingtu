services:
  zizhu-qingtu:
    image: ghcr.io/zizhu-gezhu/zizhu-qingtu:${ZIZHU_QINGTU_TAG:-latest}
    container_name: zizhu-qingtu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3456
    ports:
      - "${ZIZHU_QINGTU_BIND:-0.0.0.0}:${ZIZHU_QINGTU_PORT:-3456}:3456"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3456/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
